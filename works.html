<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works — CryStar Studio</title>
  <meta name="description" content="CryStar Studioが制作しているゲーム・小説作品の一覧。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>

<!-- data-page  … ヘッダーの現在地判定（site.config.js の NAV の id）
     data-script … このページで動かすスクリプト（main.js の PAGE_SCRIPTS のキー）
     has-worknav … 作品タブの分だけ本文を下げるためのクラス -->
<body data-page="works" data-script="works-home" class="has-worknav">

  <a class="skip-link" href="#main">本文へスキップ</a>

  <page-bg data-code="home"></page-bg>

  <site-header></site-header>
  <work-nav data-current="home"></work-nav>

  <main class="page" id="main">

    <header class="page-head wrap">
      <p class="eyebrow">Works</p>
      <h1 class="page-head__title">
        作品
        <span class="page-head__ja">Works</span>
      </h1>
    </header>

    <!-- 一覧は works.config.js の WORKS から自動生成される -->
    <div class="blur-panel">
      <div class="works-list wrap" data-works-list></div>
    </div>

  </main>

  <site-footer></site-footer>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
